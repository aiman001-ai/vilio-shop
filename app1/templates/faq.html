{% extends "base.html" %}

{% block content %}
<div class="container" style="margin-top: 100px; padding-bottom: 80px; max-width: 800px;">
    <h1 style="text-align: center; color: #282c3f; font-weight: 700; margin-bottom: 10px;">Frequently Asked Questions</h1>
    <p style="text-align: center; color: #7e818c; margin-bottom: 40px;">Find answers to your most common queries here.</p>

    {% for section in faqs %}
    <h3 style="color: #ff3f6c; margin-top: 30px; font-size: 1.2rem; text-transform: uppercase;">{{ section.category }}</h3>
    
    {% for item in section.questions %}
    <div style="border-bottom: 1px solid #eaeaec; margin-bottom: 5px;">
        <button class="faq-btn" style="width: 100%; text-align: left; padding: 18px; background: none; border: none; outline: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 600; color: #282c3f; font-size: 1.1rem;">{{ item.q }}</span>
            <i class="fas fa-chevron-down" style="font-size: 0.8rem; transition: 0.3s;"></i>
        </button>
        <div class="faq-answer" style="max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; background: #f9f9f9; padding: 0 18px;">
            <p style="padding-bottom: 18px; color: #535766; line-height: 1.6;">{{ item.a }}</p>
        </div>
    </div>
    {% endfor %}
    {% endfor %}
</div>

<script>
    document.querySelectorAll('.faq-btn').forEach(button => {
        button.addEventListener('click', () => {
            const answer = button.nextElementSibling;
            const icon = button.querySelector('i');
            
            // Toggle answer
            if (answer.style.maxHeight && answer.style.maxHeight !== '0px') {
                answer.style.maxHeight = '0px';
                icon.style.transform = 'rotate(0deg)';
            } else {
                answer.style.maxHeight = answer.scrollHeight + 'px';
                icon.style.transform = 'rotate(180deg)';
            }
        });
    });
</script>
{% endblock %}
