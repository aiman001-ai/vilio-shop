{% extends "base.html" %}

{% block extra_css %}
<style>
    @media (max-width: 768px) {
        .mobile-bottom-nav {
            display: none !important;
        }
    }
</style>
{% endblock %}

{% block content %}
<div style="text-align: center; margin-top: 100px; padding: 20px;">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Loading...</span>
    </div>
    <h2 class="mt-4">Payment Redirecting...</h2>
    <p>Please do not refresh the page or press back button.</p>
    
    <button id="rzp-button1" class="btn btn-warning mt-3" style="display:none;">Pay Manually</button>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
    // 1. Data jo Django views se aa raha hai
    var options = {
        "key": "{{ razorpay_merchant_key }}", 
        "amount": "{{ amount }}", 
        "currency": "INR",
        "name": "Vilio", 
        "description": "Order Payment",
        "order_id": "{{ razorpay_order_id }}", 
        "handler": function (response){
            // 2. Payment success hone par Success URL par redirect
            window.location.href = "/payment-success/?payment_id=" + response.razorpay_payment_id + 
                                   "&order_id=" + response.razorpay_order_id + 
                                   "&address_id={{ address_id }}";
        },
        "prefill": {
            "name": "{{ request.user.username }}",
            "email": "{{ request.user.email }}"
        },
        "theme": {
            "color": "#f08804" 
        },
        "modal": {
            "ondismiss": function(){
                // Redirect back to checkout on modal dismiss
                window.location.href = "/checkout/";
            }
        }
    };

    var rzp1 = new Razorpay(options);

    // Fallback trigger if payment button is manually clicked
    document.getElementById('rzp-button1').onclick = function(e){
        rzp1.open();
        e.preventDefault();
    }

    // Automatically initialize payment modal on page load
    window.onload = function(){
        rzp1.open();
    };
</script>
{% endblock %}
