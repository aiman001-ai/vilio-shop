{% extends 'base.html' %}

{% block content %}
<div style="padding: 120px 20px 50px 20px; max-width: 1200px; margin: 0 auto;">
    <h2>Search Results for "{{ query }}"</h2>
    <hr>
    
    {% if products %}
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 30px;">
            {% for product in products %}
                <div style="border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center;">
                    <!-- Agar product image use kar rahe hain -->
                    {% if product.image %}
                        <img src="{{ product.image.url }}" alt="{{ product.name }}" style="max-width: 100%; height: 250px; object-fit: cover;">
                    {% endif %}
                    <h3 style="font-size: 16px; margin: 10px 0 5px 0;">{{ product.name }}</h3>
                    <p style="color: #e52e2e; font-weight: 600;">₹{{ product.price }}</p>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p style="margin-top: 20px; color: #666;">No products found matching your search.</p>
    {% endif %}
</div>
{% endblock %}
